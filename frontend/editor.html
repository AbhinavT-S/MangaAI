    <style>
        .panel-selected {
            outline: 3px solid #46ec13;
        }

        /* Speech Bubble Styles */
        /* Speech Bubble Styles */
        .bubble-base {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: black;
            font-weight: bold;
            --rotation: 0deg;
            --flip: 1;
        }

        /* Rotatable background layer using ::before */
        .bubble-base::before {
            content: '';
            position: absolute;
            inset: 0;
            background-repeat: no-repeat;
            background-size: 100% 100%;
            background-position: center;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
            transform: rotate(var(--rotation)) scaleX(var(--flip));
            z-index: -1;
        }

        /* SVG Background Definitions mapped to bubble types with SAFE URL ENCODING */
        /* Replaced < with %3C, > with %3E, # with %23 */
        .bubble-normal {
            /* Oval with tail */
            padding: 20px 30px;
        }
        .bubble-normal::before {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M150,5 C230,5 295,45 295,95 C295,145 230,185 150,185 C120,185 95,175 75,160 L30,195 L45,150 C20,135 5,115 5,95 C5,45 70,5 150,5 Z' fill='white' stroke='black' stroke-width='3'/%3E%3C/svg%3E");
        }

        .bubble-thought {
            /* Cloud shape */
            padding: 30px;
            font-style: italic;
            font-weight: normal;
        }
        .bubble-thought::before {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 210' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40,100 A30,30 0 0,1 70,55 A40,40 0 0,1 140,40 A50,50 0 0,1 230,60 A40,40 0 0,1 270,110 A30,30 0 0,1 250,160 A40,40 0 0,1 170,180 A30,30 0 0,1 110,170 A40,40 0 0,1 40,140 A30,30 0 0,1 40,100 Z M55,190 A8,8 0 1,1 55,206 A8,8 0 0,1 55,190 M35,215 A5,5 0 1,1 35,225 A5,5 0 0,1 35,215' fill='white' stroke='black' stroke-width='3'/%3E%3C/svg%3E");
        }

        .bubble-shout {
            /* Blast / Spiky */
            padding: 35px;
            font-weight: 900;
            text-transform: uppercase;
        }
        .bubble-shout::before {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20,100 L5,80 L35,70 L25,40 L60,50 L80,10 L110,40 L150,5 L180,45 L220,20 L230,60 L270,50 L250,90 L290,110 L250,130 L280,160 L230,150 L210,190 L170,160 L130,195 L110,150 L70,180 L80,130 L40,140 Z' fill='white' stroke='black' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E");
        }

        .bubble-whisper {
             /* Wavy */
             padding: 30px;
             color: #666;
             font-size: 0.9em;
        }
        .bubble-whisper::before {
             background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20,100 Q20,80 30,70 Q20,50 40,40 Q50,20 70,30 Q90,10 110,25 Q140,10 160,30 Q190,15 210,35 Q240,20 250,50 Q280,60 270,90 Q290,120 270,140 Q280,170 250,170 Q230,190 200,180 Q170,195 140,180 Q110,190 90,170 Q60,180 50,150 Q20,140 30,110 Q10,105 20,100 Z' fill='white' stroke='%23666' stroke-width='2' stroke-dasharray='5,5'/%3E%3C/svg%3E");
        }

        .bubble-scream {
            /* Flash / Dense spikes */
             padding: 35px;
             font-weight: 900;
             text-transform: uppercase;
             letter-spacing: 1px;
        }
        .bubble-scream::before {
             background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon points='150,10 160,60 190,20 185,70 230,40 210,80 260,70 230,100 280,110 230,120 270,150 220,140 240,180 200,150 190,195 170,150 150,190 130,150 110,195 100,150 60,180 80,140 30,150 70,120 20,110 70,100 40,70 90,80 70,40 115,70 110,20' fill='white' stroke='black' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E");
        }

        .bubble-narration {
            /* Clean box */
            padding: 15px;
            text-align: left;
        }
        .bubble-narration::before {
            background-color: white;
            border: 3px solid black;
            border-radius: 4px;
            box-shadow: 4px 4px 0px rgba(0,0,0,1);
            filter: none;
        }

        /* Handles */
        .resize-handle {
            position: absolute;
            bottom: -6px;
            right: -6px;
            width: 16px;
            height: 16px;
            background: #46ec13;
            cursor: se-resize;
            border-radius: 50%;
            z-index: 100;
            border: 2px solid white;
        }

        .rotate-handle {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            background: white;
            border: 2px solid #46ec13;
            color: #46ec13;
            border-radius: 50%;
            cursor: grab;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            user-select: none;
        }
        .rotate-handle:active {
            cursor: grabbing;
        }
        .rotate-handle::after {
            content: '';
            position: absolute;
            top: 22px;
            left: 50%;
            height: 12px;
            width: 2px;
            background: #46ec13;
            transform: translateX(-50%);
        }

        .flip-handle {
            position: absolute;
            top: -30px;
            right: -6px;
            width: 24px;
            height: 24px;
            background: white;
            border: 2px solid #46ec13;
            color: #46ec13;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            user-select: none;
        }
        .flip-handle:hover {
            background: #f0f0f0;
        }
    </style>

    <script>
        const canvas = document.getElementById("mangaCanvas");
        const addBubbleBtn = document.getElementById("addBubbleBtn");
        const addTextBtn = document.getElementById("addTextBtn");
        const deleteBtn = document.getElementById("deleteBtn");
        const exportBtn = document.getElementById("exportBtn");

        let selectedElement = null;
        let selectedPanel = null;
        // ===== LOCKED NEGATIVE PROMPT =====
        const LOCKED_NEGATIVE =
            "low quality, blurry, bad anatomy, extra limbs, distorted face, watermark, text";

        /* ================= DRAG FUNCTION ================= */

        function makeDraggable(el) {
            el.addEventListener("mousedown", (e) => {

                // ✅ IF clicking editable text → allow typing
                if (e.target.closest("[contenteditable]")) return;
                if (e.target.classList.contains("resize-handle")) return;


                e.preventDefault();
                selectedElement = el;

                const canvasRect = canvas.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();

                const offsetX = e.clientX - elRect.left;
                const offsetY = e.clientY - elRect.top;

                function onMouseMove(e) {
                    el.style.left =
                        (e.clientX - canvasRect.left - offsetX) + "px";
                    el.style.top =
                        (e.clientY - canvasRect.top - offsetY) + "px";
                }

                document.addEventListener("mousemove", onMouseMove);
                document.addEventListener("mouseup", () => {
                    document.removeEventListener("mousemove", onMouseMove);
                }, {
                    once: true
                });
            });

            el.addEventListener("click", () => {
                document.querySelectorAll(".selected")
                    .forEach(i => i.classList.remove("selected"));
                el.classList.add("selected");
                selectedElement = el;
            });
        }

        function makeResizable(el) {
            const handle = el.querySelector(".resize-handle");
            if (!handle) return;

            handle.addEventListener("mousedown", (e) => {
                e.stopPropagation();
                e.preventDefault();

                el.classList.add("resizing");

                const startX = e.clientX;
                const startY = e.clientY;
                const startWidth = el.offsetWidth;
                const startHeight = el.offsetHeight;

                function onMouseMove(e) {
                    const dx = (e.clientX - startX) / zoomLevel;
                    const dy = (e.clientY - startY) / zoomLevel;

                    el.style.width = Math.max(120, startWidth + dx) + "px";
                    el.style.height = Math.max(60, startHeight + dy) + "px";
                }

                document.addEventListener("mousemove", onMouseMove);
                document.addEventListener("mouseup", () => {
                    document.removeEventListener("mousemove", onMouseMove);
                    el.classList.remove("resizing");
                }, {
                    once: true
                });
            });
        }



        /* ================= SPEECH BUBBLE ================= */

        addBubbleBtn.addEventListener("click", () => {
            const bubbleType = document.getElementById("bubbleTypeSelect").value;
            const fontFamily = document.getElementById("fontFamilySelect").value;
            const fontSize = document.getElementById("fontSizeRange").value;
            
            const bubble = document.createElement("div");

            // Apply bubble type class
            bubble.className = `bubble-base bubble-${bubbleType} absolute cursor-move z-[9999]`;

            bubble.style.top = "40px";
            bubble.style.left = "40px";
            bubble.style.width = "240px";
            bubble.style.height = "160px";
            bubble.style.fontFamily = fontFamily;
            bubble.style.fontSize = fontSize + "px";

            // Create editable text inside bubble
            const textSpan = document.createElement("span");
            textSpan.contentEditable = true;
            textSpan.innerText = "Edit text";
            textSpan.spellcheck = false;
            textSpan.style.outline = "none";
            textSpan.style.cursor = "text";
            
            bubble.appendChild(textSpan);
            
            // Add resize handle
            const resizeHandle = document.createElement("div");
            resizeHandle.className = "resize-handle";
            resizeHandle.style.position = "absolute";
            resizeHandle.style.bottom = "0";
            resizeHandle.style.right = "0";
            resizeHandle.style.width = "12px";
            resizeHandle.style.height = "12px";
            resizeHandle.style.background = "#46ec13";
            resizeHandle.style.cursor = "se-resize";
            resizeHandle.style.borderRadius = "50%";
            resizeHandle.style.zIndex = "10000";
            bubble.appendChild(resizeHandle);

            // Add rotation handle
            const rotateHandle = document.createElement("div");
            rotateHandle.className = "rotate-handle";
            rotateHandle.innerHTML = "⟳";
            rotateHandle.title = "Rotate bubble";
            bubble.appendChild(rotateHandle);

            // Add flip/mirror handle
            const flipHandle = document.createElement("div");
            flipHandle.className = "flip-handle";
            flipHandle.innerHTML = "⇄";
            flipHandle.title = "Flip bubble horizontally";
            flipHandle.addEventListener("click", (e) => {
                e.stopPropagation();
                const currentFlip = bubble.style.getPropertyValue('--flip') || '1';
                const newFlip = currentFlip === '1' ? '-1' : '1';
                bubble.style.setProperty('--flip', newFlip);
            });
            bubble.appendChild(flipHandle);

            canvas.appendChild(bubble);
            makeDraggable(bubble);
            makeResizable(bubble);
            makeRotatable(bubble, rotateHandle);
        });

        function makeRotatable(bubble, handle) {
            handle.addEventListener("mousedown", (e) => {
                e.stopPropagation();
                e.preventDefault();

                const rect = bubble.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                function onMouseMove(e) {
                    const dx = e.clientX - centerX;
                    const dy = e.clientY - centerY;
                    const angle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
                    
                    bubble.style.setProperty('--rotation', `${angle}deg`);
                }

                function onMouseUp() {
                    document.removeEventListener("mousemove", onMouseMove);
                    document.removeEventListener("mouseup", onMouseUp);
                }

                document.addEventListener("mousemove", onMouseMove);
                document.addEventListener("mouseup", onMouseUp);
            });
        }

        /* ================= TEXT OVERLAY ================= */


        addTextBtn.addEventListener("click", () => {
            const fontFamily = document.getElementById("fontFamilySelect").value;
            const fontSize = document.getElementById("fontSizeRange").value;
            
            const textOverlay = document.createElement("div");

            textOverlay.style.position = "absolute";
            textOverlay.style.top = "120px";
            textOverlay.style.left = "120px";
            textOverlay.style.zIndex = "9999";
            textOverlay.style.fontFamily = fontFamily;
            textOverlay.style.fontSize = fontSize + "px";
            textOverlay.style.minWidth = "100px";
            textOverlay.style.minHeight = "40px";

            textOverlay.className =
                "bg-white border border-black border-primary px-2 py-1 cursor-move select-none";

            textOverlay.innerHTML = `
    <span contenteditable="true"
      class="text-black font-black italic tracking-widest
             cursor-text select-text focus:outline-none"
      spellcheck="false">
      Single click to edit
    </span>
  `;
            
            // Add resize handle
            const resizeHandle = document.createElement("div");
            resizeHandle.className = "resize-handle";
            resizeHandle.style.position = "absolute";
            resizeHandle.style.bottom = "0";
            resizeHandle.style.right = "0";
            resizeHandle.style.width = "12px";
            resizeHandle.style.height = "12px";
            resizeHandle.style.background = "#46ec13";
            resizeHandle.style.cursor = "se-resize";
            resizeHandle.style.borderRadius = "50%";
            resizeHandle.style.zIndex = "10000";
            textOverlay.appendChild(resizeHandle);

            canvas.appendChild(textOverlay);
            makeDraggable(textOverlay);
            makeResizable(textOverlay);
        });

        /* ================= DELETE ================= */

        deleteBtn.addEventListener("click", () => {
            if (selectedElement) {
                selectedElement.remove();
                selectedElement = null;
            }
        });
        const regenPanelBtn = document.getElementById("regenPanelBtn");

        regenPanelBtn.addEventListener("click", async () => {
            if (!selectedPanel) {
                alert("Select a panel to regenerate");
                return;
            }

            const panelIndex = selectedPanel.dataset.index;
            const panelPrompts =
                JSON.parse(localStorage.getItem("mangaPanelPrompts"));

            if (!panelPrompts || !panelPrompts[panelIndex]) {
                alert("No prompt found for this panel");
                regenPanelBtn.disabled = false;
                regenPanelBtn.innerText = "Regenerate Panel";
                return;
            }

            const regenExtra =
                document.getElementById("regenPrompt")?.value.trim();

            let prompt = panelPrompts[panelIndex];

            if (regenExtra) {
                prompt += ", " + regenExtra;
            }


            let width = 512;
            let height = 768;

            // Dynamically calculate dimensions based on the selected panel's aspect ratio
            if (selectedPanel) {
                // Get the actual displayed size of the panel (unscaled by zoom if possible, or relative)
                // Use offsetWidth/Height which includes border/padding.
                const rect = selectedPanel.getBoundingClientRect();
                
                // We want high resolution, so let's multiply the display size (which is small in the editor)
                // The editor canvas is roughly 400x600 in base size.
                // A full width panel is ~380px. We want that to be ~1024px or 768px in generation.
                // Scale factor of ~2.5 or 3 relative to base pixels.
                
                // Simpler approach: Maintain aspect ratio, maximize within 512x768 approx limits or 768x768.
                // Actually, let's just reverse-engineer the "generator.js" logic.
                
                // We can just use the panel's current aspect ratio.
                const ratio = selectedPanel.offsetWidth / selectedPanel.offsetHeight;
                
                // Base size target (e.g., 512*768 area) represents ~393k pixels
                // sqrt(393216 * ratio) = width
                
                const basePixels = 512 * 768; 
                width = Math.round(Math.sqrt(basePixels * ratio));
                height = Math.round(width / ratio);

                // Snap to multiple of 8
                width = Math.round(width / 8) * 8;
                height = Math.round(height / 8) * 8;

                // Clamp
                width = Math.max(256, Math.min(width, 1024));
                height = Math.max(256, Math.min(height, 1024));
            }

            regenPanelBtn.innerText = "Regenerating...";
            regenPanelBtn.disabled = true;

            const storedSeed = localStorage.getItem("mangaSeed");
            const storedNegative = localStorage.getItem("mangaNegative") || "";
            const seed = storedSeed ? parseInt(storedSeed) : -1;

            try {
                const res = await fetch("http://localhost:3000/generate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        prompt,
                        negative_prompt: `${LOCKED_NEGATIVE}, ${storedNegative}`,
                        width: width,
                        height: height,
                        steps: 25,
                        seed: seed
                    }),
                });

                const data = await res.json();
                const newImage = "data:image/png;base64," + data.images[0];

                selectedPanel.querySelector("img").src = newImage;

                const images =
                    JSON.parse(localStorage.getItem("mangaImages"));
                images[panelIndex] = newImage;
                localStorage.setItem("mangaImages", JSON.stringify(images));
                localStorage.setItem(
                    "mangaPanelPrompts",
                    JSON.stringify(panelPrompts)
                );


            } catch (err) {
                alert("Failed to regenerate panel");
                console.error(err);
            }

            regenPanelBtn.innerText = "Regenerate Panel";
            regenPanelBtn.disabled = false;
        });



        /* ================= EXPORT ================= */

        exportBtn.addEventListener("click", async () => {
            // Remove outlines before export
            document.querySelectorAll(".selected").forEach(el =>
                el.classList.remove("selected")
            );

            const canvasImage = await html2canvas(canvas, {
                scale: 2,
                backgroundColor: "#ffffff",
                useCORS: true // Ensure external images don't taint canvas if applicable
            });

            // ✅ FORCE GRAYSCALE & CONTRAST (Pixel Manipulation)
            // html2canvas ignores CSS filters, so we modify the pixels manually.
            const ctx = canvasImage.getContext("2d");
            const imgData = ctx.getImageData(0, 0, canvasImage.width, canvasImage.height);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                // 1. Convert to Grayscale (Luminosity)
                let gray = 0.299 * r + 0.587 * g + 0.114 * b;

                // 2. Apply Contrast (approx 1.25 like CSS)
                // Formula: ((color - 128) * factor) + 128
                gray = ((gray - 128) * 1.25) + 128;

                // Clamp values 0-255
                gray = Math.max(0, Math.min(255, gray));

                data[i] = gray;
                data[i + 1] = gray;
                data[i + 2] = gray;
            }

            ctx.putImageData(imgData, 0, 0);

            const link = document.createElement("a");
            link.download = "manga-page.png";
            link.href = canvasImage.toDataURL("image/png");
            link.click();
        });

        /* ===== APPLY FONT SIZE ===== */
        fontSizeRange.addEventListener("input", () => {
            if (!selectedElement) return;

            const editable = selectedElement.querySelector("[contenteditable]");
            if (!editable) return;

            editable.style.fontSize = fontSizeRange.value + "px";
            fontSizeLabel.textContent = fontSizeRange.value + "px";
        });

        /* ===== APPLY FONT FAMILY ===== */
        fontFamilySelect.addEventListener("change", () => {
            if (!selectedElement) return;

            const editable = selectedElement.querySelector("[contenteditable]");
            if (!editable) return;

            editable.style.fontFamily = fontFamilySelect.value;
        });

        /* ================= ZOOM & PAN SYSTEM ================= */

        const zoomInBtn = document.getElementById("zoomInBtn");
        const zoomOutBtn = document.getElementById("zoomOutBtn");
        const zoomLabel = document.getElementById("zoomLabel");
        const workspace = document.querySelector("section"); // The container

        let zoomLevel = 1;
        let panX = 0;
        let panY = 0;
        let isPanning = false;
        let startPanX = 0;
        let startPanY = 0;

        const MIN_ZOOM = 0.5;
        const MAX_ZOOM = 2;
        const ZOOM_STEP = 0.1;

        function updateTransform() {
            // Apply both scale and translation
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
            // Important: Change origin to top-left so translation works predictably, 
            // or keep center and adjust math. standardizing on center for now but resetting origin usually helps panning.
            // Actually, for pan + zoom, standard is 0 0 or center. Let's try center first.
            // If we use translate, standard CSS transform order is essential.
            canvas.style.transformOrigin = "center center";
            zoomLabel.textContent = Math.round(zoomLevel * 100) + "%";
        }

        zoomInBtn.addEventListener("click", () => {
            if (zoomLevel < MAX_ZOOM) {
                zoomLevel += ZOOM_STEP;
                updateTransform();
            }
        });

        zoomOutBtn.addEventListener("click", () => {
            if (zoomLevel > MIN_ZOOM) {
                zoomLevel -= ZOOM_STEP;
                updateTransform();
            }
        });

        /* ===== PANNING LOGIC ===== */
        // We attach listener to the workspace background
        workspace.addEventListener("mousedown", (e) => {
            // Only pan if clicking the background (section), not the canvas itself or tools
            if (e.target.closest("#mangaCanvas")) return;
            
            isPanning = true;
            startPanX = e.clientX - panX;
            startPanY = e.clientY - panY;
            workspace.style.cursor = "grabbing";
        });

        document.addEventListener("mousemove", (e) => {
            if (!isPanning) return;
            e.preventDefault();
            panX = e.clientX - startPanX;
            panY = e.clientY - startPanY;
            updateTransform();
        });

        document.addEventListener("mouseup", () => {
            if (isPanning) {
                isPanning = false;
                workspace.style.cursor = "default";
            }
        });

        /* Initial */
        updateTransform();
    </script>


    <style>
        .selected {
            outline: 2px dashed #46ec13;
        }

        [contenteditable]:focus {
            outline: none;
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const panelGrid = document.getElementById("panelGrid");
            const canvas = document.getElementById("mangaCanvas");

            const panels = parseInt(localStorage.getItem("mangaPanels")) || 4;
            const images = JSON.parse(localStorage.getItem("mangaImages")) || [];
            const savedLayout = JSON.parse(localStorage.getItem("mangaPanelLayout")) || null;

            // Set canvas to manga page style with absolute positioning (same size as generator preview)
            panelGrid.className = "relative bg-white";
            panelGrid.style.width = "400px";
            panelGrid.style.height = "600px";

            images.forEach((src, index) => {
                const panel = document.createElement("div");

                // Use saved layout if available, otherwise use default positioning
                if (savedLayout && savedLayout[index]) {
                    const layout = savedLayout[index];
                    panel.className = "absolute border-[3px] border-black bg-white cursor-pointer overflow-hidden";
                    panel.style.left = layout.x + "%";
                    panel.style.top = layout.y + "%";
                    panel.style.width = layout.width + "%";
                    panel.style.height = layout.height + "%";
                } else {
                    // Fallback to grid-based positioning
                    panel.className = "relative border-2 border-black bg-white cursor-pointer overflow-hidden";
                }

                panel.dataset.index = index;

                panel.innerHTML = `
    <img src="${src}"
         class="w-full h-full object-cover grayscale contrast-125 pointer-events-none" />
  `;

                // PANEL SELECTION
                panel.addEventListener("click", () => {
                    document.querySelectorAll(".panel-selected")
                        .forEach(p => p.classList.remove("panel-selected"));

                    panel.classList.add("panel-selected");
                    selectedPanel = panel;
                });

                panelGrid.appendChild(panel);
            });


            // Let canvas size itself naturally
            canvas.style.width = "fit-content";
        });
    </script>
