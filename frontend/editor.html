    <script>
        const canvas = document.getElementById("mangaCanvas");
        const addBubbleBtn = document.getElementById("addBubbleBtn");
        const addTextBtn = document.getElementById("addTextBtn");
        const deleteBtn = document.getElementById("deleteBtn");
        const exportBtn = document.getElementById("exportBtn");

        let selectedElement = null;
        let selectedPanel = null;
        // ===== LOCKED NEGATIVE PROMPT =====
        const LOCKED_NEGATIVE =
            "low quality, blurry, bad anatomy, extra limbs, distorted face, watermark, text";

        /* ================= DRAG FUNCTION ================= */

        function makeDraggable(el) {
            el.addEventListener("mousedown", (e) => {

                // ✅ IF clicking editable text → allow typing
                if (e.target.closest("[contenteditable]")) return;
                if (e.target.classList.contains("resize-handle")) return;


                e.preventDefault();
                selectedElement = el;

                const canvasRect = canvas.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();

                const offsetX = e.clientX - elRect.left;
                const offsetY = e.clientY - elRect.top;

                function onMouseMove(e) {
                    el.style.left =
                        (e.clientX - canvasRect.left - offsetX) + "px";
                    el.style.top =
                        (e.clientY - canvasRect.top - offsetY) + "px";
                }

                document.addEventListener("mousemove", onMouseMove);
                document.addEventListener("mouseup", () => {
                    document.removeEventListener("mousemove", onMouseMove);
                }, {
                    once: true
                });
            });

            el.addEventListener("click", () => {
                document.querySelectorAll(".selected")
                    .forEach(i => i.classList.remove("selected"));
                el.classList.add("selected");
                selectedElement = el;
            });
        }

        function makeResizable(el) {
            const handle = el.querySelector(".resize-handle");
            if (!handle) return;

            handle.addEventListener("mousedown", (e) => {
                e.stopPropagation();
                e.preventDefault();

                el.classList.add("resizing");

                const startX = e.clientX;
                const startY = e.clientY;
                const startWidth = el.offsetWidth;
                const startHeight = el.offsetHeight;

                function onMouseMove(e) {
                    const dx = (e.clientX - startX) / zoomLevel;
                    const dy = (e.clientY - startY) / zoomLevel;

                    el.style.width = Math.max(120, startWidth + dx) + "px";
                    el.style.height = Math.max(60, startHeight + dy) + "px";
                }

                document.addEventListener("mousemove", onMouseMove);
                document.addEventListener("mouseup", () => {
                    document.removeEventListener("mousemove", onMouseMove);
                    el.classList.remove("resizing");
                }, {
                    once: true
                });
            });
        }



        /* ================= SPEECH BUBBLE ================= */

        addBubbleBtn.addEventListener("click", () => {
            const bubbleType = document.getElementById("bubbleTypeSelect").value;
            const fontFamily = document.getElementById("fontFamilySelect").value;
            const fontSize = document.getElementById("fontSizeRange").value;
            
            const bubble = document.createElement("div");

            // Apply bubble type class
            bubble.className = `bubble-${bubbleType} absolute cursor-move z-[9999]`;

            bubble.style.top = "40px";
            bubble.style.left = "40px";
            bubble.style.width = "200px";
            bubble.style.height = "120px";
            bubble.style.fontFamily = fontFamily;
            bubble.style.fontSize = fontSize + "px";

            // Create editable text inside bubble
            const textSpan = document.createElement("span");
            textSpan.contentEditable = true;
            textSpan.innerText = "Edit text";
            textSpan.spellcheck = false;
            textSpan.style.outline = "none";
            textSpan.style.cursor = "text";
            
            bubble.appendChild(textSpan);
            
            // Add resize handle
            const resizeHandle = document.createElement("div");
            resizeHandle.className = "resize-handle";
            resizeHandle.style.position = "absolute";
            resizeHandle.style.bottom = "0";
            resizeHandle.style.right = "0";
            resizeHandle.style.width = "12px";
            resizeHandle.style.height = "12px";
            resizeHandle.style.background = "#46ec13";
            resizeHandle.style.cursor = "se-resize";
            resizeHandle.style.borderRadius = "50%";
            resizeHandle.style.zIndex = "10000";
            bubble.appendChild(resizeHandle);

            canvas.appendChild(bubble);
            makeDraggable(bubble);
            makeResizable(bubble);
        });

        /* ================= TEXT OVERLAY ================= */


        addTextBtn.addEventListener("click", () => {
            const fontFamily = document.getElementById("fontFamilySelect").value;
            const fontSize = document.getElementById("fontSizeRange").value;
            
            const textOverlay = document.createElement("div");

            textOverlay.style.position = "absolute";
            textOverlay.style.top = "120px";
            textOverlay.style.left = "120px";
            textOverlay.style.zIndex = "9999";
            textOverlay.style.fontFamily = fontFamily;
            textOverlay.style.fontSize = fontSize + "px";
            textOverlay.style.minWidth = "100px";
            textOverlay.style.minHeight = "40px";

            textOverlay.className =
                "bg-white border border-black border-primary px-2 py-1 cursor-move select-none";

            textOverlay.innerHTML = `
    <span contenteditable="true"
      class="text-black font-black italic uppercase tracking-widest
             cursor-text select-text focus:outline-none"
      spellcheck="false">
      Single click to edit
    </span>
  `;
            
            // Add resize handle
            const resizeHandle = document.createElement("div");
            resizeHandle.className = "resize-handle";
            resizeHandle.style.position = "absolute";
            resizeHandle.style.bottom = "0";
            resizeHandle.style.right = "0";
            resizeHandle.style.width = "12px";
            resizeHandle.style.height = "12px";
            resizeHandle.style.background = "#46ec13";
            resizeHandle.style.cursor = "se-resize";
            resizeHandle.style.borderRadius = "50%";
            resizeHandle.style.zIndex = "10000";
            textOverlay.appendChild(resizeHandle);

            canvas.appendChild(textOverlay);
            makeDraggable(textOverlay);
            makeResizable(textOverlay);
        });

        /* ================= DELETE ================= */

        deleteBtn.addEventListener("click", () => {
            if (selectedElement) {
                selectedElement.remove();
                selectedElement = null;
            }
        });
        const regenPanelBtn = document.getElementById("regenPanelBtn");

        regenPanelBtn.addEventListener("click", async () => {
            if (!selectedPanel) {
                alert("Select a panel to regenerate");
                return;
            }

            const panelIndex = selectedPanel.dataset.index;
            const panelPrompts =
                JSON.parse(localStorage.getItem("mangaPanelPrompts"));

            if (!panelPrompts || !panelPrompts[panelIndex]) {
                alert("No prompt found for this panel");
                regenPanelBtn.disabled = false;
                regenPanelBtn.innerText = "Regenerate Panel";
                return;
            }

            const regenExtra =
                document.getElementById("regenPrompt")?.value.trim();

            let prompt = panelPrompts[panelIndex];

            if (regenExtra) {
                prompt += ", " + regenExtra;
            }


            regenPanelBtn.innerText = "Regenerating...";
            regenPanelBtn.disabled = true;

            try {
                const res = await fetch("http://localhost:3000/generate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        prompt,
                        negative_prompt: LOCKED_NEGATIVE,
                        width: 512,
                        height: 768,
                        steps: 25
                    }),
                });

                const data = await res.json();
                const newImage = "data:image/png;base64," + data.images[0];

                selectedPanel.querySelector("img").src = newImage;

                const images =
                    JSON.parse(localStorage.getItem("mangaImages"));
                images[panelIndex] = newImage;
                localStorage.setItem("mangaImages", JSON.stringify(images));
                localStorage.setItem(
                    "mangaPanelPrompts",
                    JSON.stringify(panelPrompts)
                );


            } catch (err) {
                alert("Failed to regenerate panel");
                console.error(err);
            }

            regenPanelBtn.innerText = "Regenerate Panel";
            regenPanelBtn.disabled = false;
        });



        /* ================= EXPORT ================= */

        exportBtn.addEventListener("click", async () => {
            // Remove outlines before export
            document.querySelectorAll(".selected").forEach(el =>
                el.classList.remove("selected")
            );

            const canvasImage = await html2canvas(canvas, {
                scale: 2,
                backgroundColor: "#ffffff"
            });

            const link = document.createElement("a");
            link.download = "manga-page.png";
            link.href = canvasImage.toDataURL("image/png");
            link.click();
        });

        /* ===== APPLY FONT SIZE ===== */
        fontSizeRange.addEventListener("input", () => {
            if (!selectedElement) return;

            const editable = selectedElement.querySelector("[contenteditable]");
            if (!editable) return;

            editable.style.fontSize = fontSizeRange.value + "px";
            fontSizeLabel.textContent = fontSizeRange.value + "px";
        });

        /* ===== APPLY FONT FAMILY ===== */
        fontFamilySelect.addEventListener("change", () => {
            if (!selectedElement) return;

            const editable = selectedElement.querySelector("[contenteditable]");
            if (!editable) return;

            editable.style.fontFamily = fontFamilySelect.value;
        });

        /* ================= ZOOM SYSTEM ================= */

        const zoomInBtn = document.getElementById("zoomInBtn");
        const zoomOutBtn = document.getElementById("zoomOutBtn");
        const zoomLabel = document.getElementById("zoomLabel");

        let zoomLevel = 1;
        const MIN_ZOOM = 0.5;
        const MAX_ZOOM = 2;
        const ZOOM_STEP = 0.1;

        function applyZoom() {
            canvas.style.transform = `scale(${zoomLevel})`;
            canvas.style.transformOrigin = "center center";
            zoomLabel.textContent = Math.round(zoomLevel * 100) + "%";
        }

        zoomInBtn.addEventListener("click", () => {
            if (zoomLevel < MAX_ZOOM) {
                zoomLevel += ZOOM_STEP;
                applyZoom();
            }
        });

        zoomOutBtn.addEventListener("click", () => {
            if (zoomLevel > MIN_ZOOM) {
                zoomLevel -= ZOOM_STEP;
                applyZoom();
            }
        });

        /* Initial */
        applyZoom();
    </script>


    <style>
        .selected {
            outline: 2px dashed #46ec13;
        }

        [contenteditable]:focus {
            outline: none;
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const panelGrid = document.getElementById("panelGrid");
            const canvas = document.getElementById("mangaCanvas");

            const panels = parseInt(localStorage.getItem("mangaPanels")) || 4;
            const images = JSON.parse(localStorage.getItem("mangaImages")) || [];
            const savedLayout = JSON.parse(localStorage.getItem("mangaPanelLayout")) || null;

            // Set canvas to manga page style with absolute positioning (same size as generator preview)
            panelGrid.className = "relative bg-white";
            panelGrid.style.width = "400px";
            panelGrid.style.height = "600px";

            images.forEach((src, index) => {
                const panel = document.createElement("div");

                // Use saved layout if available, otherwise use default positioning
                if (savedLayout && savedLayout[index]) {
                    const layout = savedLayout[index];
                    panel.className = "absolute border-[3px] border-black bg-white cursor-pointer";
                    panel.style.left = layout.x + "%";
                    panel.style.top = layout.y + "%";
                    panel.style.width = layout.width + "%";
                    panel.style.height = layout.height + "%";
                } else {
                    // Fallback to grid-based positioning
                    panel.className = "relative border-2 border-black bg-white cursor-pointer";
                }

                panel.dataset.index = index;

                panel.innerHTML = `
    <img src="${src}"
         class="w-full h-full object-cover grayscale contrast-125 pointer-events-none" />
  `;

                // PANEL SELECTION
                panel.addEventListener("click", () => {
                    document.querySelectorAll(".panel-selected")
                        .forEach(p => p.classList.remove("panel-selected"));

                    panel.classList.add("panel-selected");
                    selectedPanel = panel;
                });

                panelGrid.appendChild(panel);
            });


            // Let canvas size itself naturally
            canvas.style.width = "fit-content";
        });
    </script>


</body>

</html>
