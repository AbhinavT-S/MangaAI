<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white overflow-hidden h-screen flex flex-col">

<div class="flex items-center justify-center size-10 rounded-full bg-primary/20 text-primary">
<span class="material-symbols-outlined text-3xl">auto_stories</span>
</div>

</div>
<div class="flex flex-1 justify-end gap-8 items-center">
<nav class="hidden md:flex items-center gap-9">
<a class="text-gray-400 hover:text-primary transition-colors text-sm font-medium leading-normal" href="index.html">Home</a>
<a class="text-gray-400 hover:text-primary transition-colors text-sm font-medium leading-normal" href="generator.html">Generator</a>
<a class="text-white text-sm font-bold leading-normal border-b-2 border-primary pb-1" href="editor.html">Editor</a>
</nav>
<div class="h-6 w-px bg-gray-700 mx-2 hidden md:block"></div>
<button id="exportBtn" class="flex cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 px-6 bg-primary hover:bg-green-400 transition-colors text-[#131811] text-sm font-bold leading-normal tracking-[0.015em]">
<span class="truncate">Export Project</span>
</button>
</div>
</header>
<!-- Main Workspace -->
<main class="flex-1 flex overflow-hidden relative">
<!-- Left Toolbar -->
<aside class="w-80 flex-none bg-panel-dark border-r border-[#2c3928] p-6 flex flex-col gap-6 z-20 shadow-xl overflow-y-auto">
<div class="space-y-2">
<h3 class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-4">Tools</h3>
<button id="addBubbleBtn" class="w-full group flex items-center gap-4 p-4 rounded-2xl bg-[#1e1e24] hover:bg-primary/10 border border-transparent hover:border-primary/30 transition-all duration-200">
<div class="size-10 rounded-full bg-[#2a2a33] group-hover:bg-primary text-white group-hover:text-black flex items-center justify-center transition-colors">
<span class="material-symbols-outlined">chat_bubble</span>
</div>
<div class="text-left">
<span class="block text-white font-bold text-sm group-hover:text-primary">Speech Bubble</span>
<span class="block text-gray-500 text-xs mt-0.5">Drag to canvas</span>
</div>
</button>
<button id="addTextBtn" class="w-full group flex items-center gap-4 p-4 rounded-2xl bg-[#1e1e24] hover:bg-primary/10 border border-transparent hover:border-primary/30 transition-all duration-200">
<div class="size-10 rounded-full bg-[#2a2a33] group-hover:bg-primary text-white group-hover:text-black flex items-center justify-center transition-colors">
<span class="material-symbols-outlined">format_shapes</span>
</div>
<div class="text-left">
<span class="block text-white font-bold text-sm group-hover:text-primary">Text Overlay</span>
<span class="block text-gray-500 text-xs mt-0.5">Add narration text</span>
</div>
</button>
<button id="deleteBtn" class="w-full group flex items-center gap-4 p-4 rounded-2xl bg-[#1e1e24] hover:bg-secondary/10 border border-transparent hover:border-secondary/30 transition-all duration-200 mt-8">
<div class="size-10 rounded-full bg-[#2a2a33] group-hover:bg-secondary text-white group-hover:text-white flex items-center justify-center transition-colors">
<span class="material-symbols-outlined">delete</span>
</div>
<div class="text-left">
<span class="block text-white font-bold text-sm group-hover:text-secondary">Delete Item</span>
<span class="block text-gray-500 text-xs mt-0.5">Remove selected</span>
</div>
</button>
</div>
<div class="flex justify-between items-center">
  <span class="text-sm text-gray-300">Font Size</span>
  <span id="fontSizeLabel" class="text-xs text-primary font-mono">16px</span>
</div>
<input id="fontSizeRange"
       type="range"
       min="10"
       max="40"
       value="16"
       class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-primary"/>
<div class="space-y-2 mt-4">
  <span class="text-sm text-gray-300">Font Family</span>

  <select id="fontFamilySelect"
          class="w-full bg-[#2a2a33] text-white text-sm rounded-lg px-3 py-2 border border-gray-700 focus:outline-none">
    <option value="Manrope">Manrope</option>
    <option value="Bookman Old Style">Bookman Old Style</option>
    <option value="Comic Sans MS">Comic Sans</option>
    <option value="Chiller">Chiller</option>
    <option value="Ink Free">Ink Free</option>
  </select>
</div>
</div>
</aside>
<!-- Canvas Area -->
<section class="flex-1 bg-background-dark relative flex items-start justify-center p-12 overflow-auto">

  <!-- Manga Page Canvas -->
  <div id="mangaCanvas"
       class="relative bg-white shadow-2xl shadow-primary/10 ring-1 ring-white/10
              z-30 overflow-visible flex flex-col">

    <!-- PANEL GRID (AUTO HEIGHT) -->
    <div id="panelGrid" class="grid gap-2 p-4 bg-white"></div>

  </div>

  <!-- Zoom Controls -->
  <div class="absolute bottom-8 right-8 bg-[#1e1e24] border border-gray-700 rounded-full
              p-2 flex items-center gap-2 shadow-lg z-20">
    <button id="zoomOutBtn" class="size-8 rounded-full hover:bg-gray-700 text-white">−</button>
    <span id="zoomLabel" class="text-xs text-gray-300 font-mono w-12 text-center">100%</span>
    <button id="zoomInBtn" class="size-8 rounded-full hover:bg-gray-700 text-white">+</button>
  </div>

</section>
</main>
<script>
const canvas = document.getElementById("mangaCanvas");
const addBubbleBtn = document.getElementById("addBubbleBtn");
const addTextBtn = document.getElementById("addTextBtn");
const deleteBtn = document.getElementById("deleteBtn");
const exportBtn = document.getElementById("exportBtn");

let selectedElement = null;

/* ================= DRAG FUNCTION ================= */

function makeDraggable(el) {
  el.addEventListener("mousedown", (e) => {

    // ✅ IF clicking editable text → allow typing
    if (e.target.closest("[contenteditable]")) return;
    if (e.target.classList.contains("resize-handle")) return;


    e.preventDefault();
    selectedElement = el;

    const canvasRect = canvas.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();

    const offsetX = e.clientX - elRect.left;
    const offsetY = e.clientY - elRect.top;

    function onMouseMove(e) {
      el.style.left =
        (e.clientX - canvasRect.left - offsetX) + "px";
      el.style.top =
        (e.clientY - canvasRect.top - offsetY) + "px";
    }

    document.addEventListener("mousemove", onMouseMove);
    document.addEventListener("mouseup", () => {
      document.removeEventListener("mousemove", onMouseMove);
    }, { once: true });
  });

  el.addEventListener("click", () => {
    document.querySelectorAll(".selected")
      .forEach(i => i.classList.remove("selected"));
    el.classList.add("selected");
    selectedElement = el;
  });
}
function makeResizable(el) {
  const handle = el.querySelector(".resize-handle");
  if (!handle) return;

  handle.addEventListener("mousedown", (e) => {
    e.stopPropagation();
    e.preventDefault();

    el.classList.add("resizing");

    const startX = e.clientX;
    const startY = e.clientY;
    const startWidth = el.offsetWidth;
    const startHeight = el.offsetHeight;

    function onMouseMove(e) {
      const dx = (e.clientX - startX) / zoomLevel;
      const dy = (e.clientY - startY) / zoomLevel;

      el.style.width = Math.max(120, startWidth + dx) + "px";
      el.style.height = Math.max(60, startHeight + dy) + "px";
    }

    document.addEventListener("mousemove", onMouseMove);
    document.addEventListener("mouseup", () => {
      document.removeEventListener("mousemove", onMouseMove);
      el.classList.remove("resizing");
    }, { once: true });
  });
}



/* ================= SPEECH BUBBLE ================= */

addBubbleBtn.addEventListener("click", () => {
  const bubble = document.createElement("div");

  bubble.className =
    "absolute bg-white border-2 border-black rounded-full px-4 py-3 max-w-[300px] shadow-lg cursor-move z-[9999]";

  bubble.style.top = "40px";
  bubble.style.left = "40px";
  bubble.style.width = "200px";

  bubble.innerHTML = `
    <p contenteditable="true"
       class="text-black text-xs font-bold text-center leading-tight focus:outline-none">
       Edit text
    </p>

    <div class="absolute -bottom-2 left-1/2 -translate-x-1/2
                w-4 h-4 bg-white border-r-2 border-b-2
                border-black rotate-45"></div>

    
  `;

  canvas.appendChild(bubble);
  makeDraggable(bubble);
  makeResizable(bubble);
});

/* ================= TEXT OVERLAY ================= */


addTextBtn.addEventListener("click", () => {
  const textOverlay = document.createElement("div");

  textOverlay.style.position = "absolute";
  textOverlay.style.top = "120px";
  textOverlay.style.left = "120px";
  textOverlay.style.zIndex = "9999";

  textOverlay.className =
    "bg-white border border-black border-primary px-2 py-1 cursor-move select-none";

  textOverlay.innerHTML = `
    <span contenteditable="true"
      class="text-black text-[12px] font-black italic uppercase tracking-widest
             cursor-text select-text focus:outline-none"
      spellcheck="false">
      Single click to edit
    </span>
  `;

  canvas.appendChild(textOverlay);
  makeDraggable(textOverlay);
});

/* ================= DELETE ================= */

deleteBtn.addEventListener("click", () => {
  if (selectedElement) {
    selectedElement.remove();
    selectedElement = null;
  }
});

/* ================= EXPORT ================= */

exportBtn.addEventListener("click", async () => {
  // Remove outlines before export
  document.querySelectorAll(".selected").forEach(el =>
    el.classList.remove("selected")
  );

  const canvasImage = await html2canvas(canvas, {
    scale: 2,
    backgroundColor: "#ffffff"
  });

  const link = document.createElement("a");
  link.download = "manga-page.png";
  link.href = canvasImage.toDataURL("image/png");
  link.click();
});

/* ===== APPLY FONT SIZE ===== */
fontSizeRange.addEventListener("input", () => {
  if (!selectedElement) return;

  const editable = selectedElement.querySelector("[contenteditable]");
  if (!editable) return;

  editable.style.fontSize = fontSizeRange.value + "px";
  fontSizeLabel.textContent = fontSizeRange.value + "px";
});

/* ===== APPLY FONT FAMILY ===== */
fontFamilySelect.addEventListener("change", () => {
  if (!selectedElement) return;

  const editable = selectedElement.querySelector("[contenteditable]");
  if (!editable) return;

  editable.style.fontFamily = fontFamilySelect.value;
});

/* ================= ZOOM SYSTEM ================= */

const zoomInBtn = document.getElementById("zoomInBtn");
const zoomOutBtn = document.getElementById("zoomOutBtn");
const zoomLabel = document.getElementById("zoomLabel");

let zoomLevel = 1;
const MIN_ZOOM = 0.5;
const MAX_ZOOM = 2;
const ZOOM_STEP = 0.1;

function applyZoom() {
  canvas.style.transform = `scale(${zoomLevel})`;
  canvas.style.transformOrigin = "center center";
  zoomLabel.textContent = Math.round(zoomLevel * 100) + "%";
}

zoomInBtn.addEventListener("click", () => {
  if (zoomLevel < MAX_ZOOM) {
    zoomLevel += ZOOM_STEP;
    applyZoom();
  }
});

zoomOutBtn.addEventListener("click", () => {
  if (zoomLevel > MIN_ZOOM) {
    zoomLevel -= ZOOM_STEP;
    applyZoom();
  }
});

/* Initial */
applyZoom();
</script>


<style>
.selected {
  outline: 2px dashed #46ec13;
}

[contenteditable]:focus {
  outline: none;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const panelGrid = document.getElementById("panelGrid");
  const canvas = document.getElementById("mangaCanvas");

  const panels = parseInt(localStorage.getItem("mangaPanels")) || 4;
  const images = JSON.parse(localStorage.getItem("mangaImages")) || [];

  function getGrid(count) {
    if (count === 1) return "grid-cols-1";
    if (count === 2) return "grid-cols-1";
    if (count === 3) return "grid-cols-1";
    if (count === 4) return "grid-cols-2";
    if (count === 6) return "grid-cols-2";
    return "grid-cols-2";
  }

  // RESET classes (VERY IMPORTANT)
  panelGrid.className = `grid gap-2 p-4 bg-white ${getGrid(panels)}`;

  images.forEach(src => {
  const img = document.createElement("img");
  img.src = src;
  panelGrid.appendChild(img);
});

  // Let canvas size itself naturally
  canvas.style.width = "fit-content";
});
</script>


</body></html>
