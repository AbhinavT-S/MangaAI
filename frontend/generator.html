<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>AI Manga Creator</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Theme Configuration -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#46ec13",
                        "accent-pink": "#FF2C8B",
                        "background-dark": "#0D0D0F",
                        "surface-dark": "#1A1A1E",
                        "input-dark": "#08080A",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "1.5rem",
                        "xl": "2rem",
                        "2xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        /* Custom scrollbar for textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }

        textarea::-webkit-scrollbar-track {
            background: #1A1A1E;
            border-radius: 4px;
        }

        textarea::-webkit-scrollbar-thumb {
            background: #2c3928;
            border-radius: 4px;
        }

        textarea::-webkit-scrollbar-thumb:hover {
            background: #46ec13;
        }
    </style>
</head>

<body class="bg-background-dark text-white font-display overflow-x-hidden min-h-screen flex flex-col">
    <!-- Top Navigation -->
    <header class="w-full border-b border-white/5 bg-background-dark/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-[1440px] mx-auto px-6 h-20 flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="size-10 bg-surface-dark rounded-xl flex items-center justify-center border border-white/10 text-primary">
                    <span class="material-symbols-outlined text-2xl">auto_awesome_mosaic</span>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-white">Manga<span class="text-primary">AI</span></h1>
            </div>
            <!-- Nav Links -->
            <nav class="hidden md:flex items-center gap-10">
                <a class="text-sm font-medium text-white/60 hover:text-white transition-colors" href="index.html">Home</a>
                <a class="text-sm font-medium text-primary flex items-center gap-2" href="generator.html">Generator</span>
                </a>
                <a class="text-sm font-medium text-white/60 hover:text-white transition-colors" href="editor.html">Editor</a>
            </nav>
        </div>
    </header>
    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 relative overflow-hidden">
        <!-- Ambient Background Glows -->
        <div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
        <div class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-accent-pink/5 rounded-full blur-[120px] pointer-events-none"></div>
        <div class="w-full max-w-5xl z-10">
            <!-- Headline -->
            <div class="text-center mb-10">
                <h2 class="text-4xl md:text-5xl font-bold mb-4 tracking-tight">Create Your Manga</h2>
                <p class="text-white/50 text-lg max-w-xl mx-auto">Turn your stories into visual panels instantly. Describe your scene, pick your layout, and let AI do the rest.</p>
            </div>
            <!-- Generator Card -->
            <div class="bg-surface-dark border border-white/5 rounded-[2.5rem] p-6 md:p-10 shadow-2xl relative overflow-hidden">
                <!-- Decorative top gradient line -->
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary/50 to-transparent opacity-50"></div>
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
                    <!-- LEFT COLUMN: Inputs -->
                    <div class="lg:col-span-5 flex flex-col gap-6">
                        <!-- Character Prompt -->
                        <label class="flex items-center gap-2 text-sm font-semibold text-white/80 pl-1">
                            <span class="material-symbols-outlined text-primary text-[18px]">person</span> Character Prompt
                        </label>
                        <textarea id="characterPrompt" class="w-full bg-input-dark border border-white/10 rounded-xl p-4 text-white" placeholder="Describe the character once (gender, age, clothes, hair...)">
</textarea>
                        <!-- Prompt Input -->
                        <div id="promptInput" class="space-y-3">
                            <label class="flex items-center justify-between text-sm font-semibold text-white/80 pl-1">
                                <span class="flex items-center gap-2"><span class="material-symbols-outlined text-primary text-[18px]">edit_note</span> Story Prompt</span>
                            </label>
                            <div class="relative group">
                                <textarea id="myText" class="w-full bg-input-dark border border-white/10 rounded-xl p-5 text-base text-white placeholder:text-white/20 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-transparent transition-all min-h-[180px] resize-none leading-relaxed" placeholder="Describe your scene (e.g., A cyberpunk samurai walking in rain, neon lights reflecting on wet pavement, high contrast, manga style...)"></textarea>
                                <div class="space-y-2 mt-4">
                                    <label class="flex items-center gap-2 text-sm font-semibold text-white/70 pl-1">
                                        <span class="material-symbols-outlined text-primary text-[18px]">block</span> Negative Prompt (optional)
                                    </label>
                                    <input id="negativePrompt" type="text" placeholder="e.g. female, color, blurry" class="w-full bg-input-dark border border-white/10 rounded-xl h-12 px-4
           text-white placeholder:text-white/30 focus:outline-none
           focus:ring-2 focus:ring-primary/50" />
                                </div>
                                <div class="absolute bottom-4 right-4 flex gap-2">
                                    </button>
                                </div>
                            </div>
                        </div>
                        <!-- Panel Selection -->
                        <div class="space-y-3">
                            <label class="text-sm font-semibold text-white/80 pl-1 flex items-center gap-2">
                                <span class="material-symbols-outlined text-primary text-[18px]">grid_view</span> Layout
                            </label>
                            <div class="relative">
                                <select id="layoutSelect" class="w-full appearance-none bg-input-dark border border-white/10 rounded-xl h-14 px-5 text-base text-white focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-transparent transition-all cursor-pointer">
                                    <option value="1">1 Panels</option>
                                    <option value="2">2 Panels (Vertical Strip)</option>
                                    <option value="3">3 Panels (Classic Strip)</option>
                                    <option value="4">4 Panels (2x2 Grid)</option>
                                    <option value="5">5 Panels (Page Layout)</option>
                                </select>
                            </div>
                        </div>
                        <!-- Generate Button -->
                        <div class="pt-4 mt-auto">
                            <button id="generateBtn" class="w-full h-14 bg-accent-pink hover:bg-[#ff449b] text-white rounded-full font-bold text-lg tracking-wide shadow-[0_0_20px_rgba(255,44,139,0.3)] hover:shadow-[0_0_30px_rgba(255,44,139,0.5)] transition-all transform active:scale-[0.98] flex items-center justify-center gap-3">
                                <span class="material-symbols-outlined">stars</span>GENERATE PANELS</button>
                            <div class="flex justify-center mt-3 gap-2 text-xs text-white/30 items-center">
                            </div>
                        </div>
                    </div>
                    <!-- RIGHT COLUMN: Preview / Output -->
                    <div id="previewContainer" class="lg:col-span-7 bg-input-dark rounded-[2rem] border border-white/5 p-6 relative min-h-[400px] flex flex-col">
                        <!-- Header for output -->
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-sm font-bold text-white/80 uppercase tracking-wider">Preview</h3>
                            <div class="flex gap-2">
                                <button class="size-8 rounded-full bg-white/5 flex items-center justify-center text-white/40 hover:text-white hover:bg-white/10 transition-colors">
                                    <span id="fullscreenBtn" class="material-symbols-outlined text-[18px] cursor-pointer">fullscreen</span>
                                </button>
                            </div>
                        </div>
                        <!-- Empty Grid -->
                        <div id="previewGrid" class="flex-1 grid grid-cols-2 gap-4 h-full">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </div>
        </div>
        </div>
    </main>
    <style>
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }

        .mask-image-gradient {
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }
    </style>
    <script>
        const layoutSelect = document.getElementById("layoutSelect");
        const previewGrid = document.getElementById("previewGrid");

        // Predefined manga panel layouts (x, y, width, height in percentages)
        // Designed with balanced aspect ratios to prevent image stacking issues
        const layouts = {
            1: [
                { x: 2, y: 2, width: 96, height: 96 }
            ],
            2: [
                { x: 2, y: 2, width: 96, height: 48 },
                { x: 2, y: 51, width: 96, height: 47 }
            ],
            3: [
                { x: 2, y: 2, width: 96, height: 31 },
                { x: 2, y: 34, width: 96, height: 31 },
                { x: 2, y: 66, width: 96, height: 32 }
            ],
            4: [
                // Manga-style: 1 large top panel, 3 smaller below
                { x: 2, y: 2, width: 96, height: 48 },   // Large top panel (wide)
                { x: 2, y: 51, width: 31, height: 47 },  // Bottom left
                { x: 34, y: 51, width: 31, height: 47 }, // Bottom center
                { x: 66, y: 51, width: 32, height: 47 }  // Bottom right
            ],
            5: [
                // Manga-style: 2 large top, 3 smaller below
                { x: 2, y: 2, width: 48, height: 48 },   // Top left (large)
                { x: 51, y: 2, width: 47, height: 48 },  // Top right (large)
                { x: 2, y: 51, width: 31, height: 47 },  // Bottom left
                { x: 34, y: 51, width: 31, height: 47 }, // Bottom center
                { x: 66, y: 51, width: 32, height: 47 }  // Bottom right
            ]
        };

        let selectedPanel = null;
        let dragOffset = { x: 0, y: 0 };
        let isResizing = false;
        let resizeHandle = null;

        function generatePanelLayout(count) {
            previewGrid.innerHTML = "";
            
            // Set preview grid to be a manga page (smaller size to fit preview)
            previewGrid.className = "relative bg-white border-4 border-black mx-auto";
            previewGrid.style.width = "400px";
            previewGrid.style.height = "600px";

            const panelLayout = layouts[count] || layouts[4];

            panelLayout.forEach((layout, index) => {
                const panel = createPanel(index + 1, layout);
                previewGrid.appendChild(panel);
            });
        }

        function createPanel(number, layout) {
            const panel = document.createElement("div");
            panel.className = "absolute border-[3px] border-black bg-white cursor-move hover:bg-gray-50 transition-colors group";
            panel.dataset.panelNumber = number;
            
            // Convert percentage to pixels
            panel.style.left = layout.x + "%";
            panel.style.top = layout.y + "%";
            panel.style.width = layout.width + "%";
            panel.style.height = layout.height + "%";

            panel.innerHTML = `
                <div class="w-full h-full flex flex-col items-center justify-center pointer-events-none">
                    <span class="material-symbols-outlined text-6xl text-gray-300">image</span>
                    <span class="text-sm text-gray-400 font-bold mt-2">Panel ${number}</span>
                </div>
                <div class="resize-handle absolute bottom-0 right-0 w-4 h-4 bg-primary cursor-se-resize opacity-0 group-hover:opacity-100 transition-opacity pointer-events-auto"></div>
            `;

            makePanelDraggable(panel);
            makePanelResizable(panel);

            return panel;
        }

        function makePanelDraggable(panel) {
            panel.addEventListener("mousedown", (e) => {
                if (e.target.classList.contains("resize-handle")) return;
                
                e.preventDefault();
                selectedPanel = panel;
                
                // Highlight selected panel
                document.querySelectorAll(".border-primary").forEach(p => {
                    if (!p.classList.contains("resize-handle")) {
                        p.classList.remove("border-primary", "border-[4px]");
                        p.classList.add("border-black", "border-[3px]");
                    }
                });
                panel.classList.remove("border-black", "border-[3px]");
                panel.classList.add("border-primary", "border-[4px]");

                const rect = panel.getBoundingClientRect();
                const containerRect = previewGrid.getBoundingClientRect();
                
                dragOffset.x = e.clientX - rect.left;
                dragOffset.y = e.clientY - rect.top;

                function onMouseMove(e) {
                    if (!selectedPanel) return;

                    let newLeft = e.clientX - containerRect.left - dragOffset.x;
                    let newTop = e.clientY - containerRect.top - dragOffset.y;

                    // Constrain to container
                    newLeft = Math.max(0, Math.min(newLeft, containerRect.width - rect.width));
                    newTop = Math.max(0, Math.min(newTop, containerRect.height - rect.height));

                    selectedPanel.style.left = (newLeft / containerRect.width * 100) + "%";
                    selectedPanel.style.top = (newTop / containerRect.height * 100) + "%";
                }

                function onMouseUp() {
                    document.removeEventListener("mousemove", onMouseMove);
                    document.removeEventListener("mouseup", onMouseUp);
                }

                document.addEventListener("mousemove", onMouseMove);
                document.addEventListener("mouseup", onMouseUp);
            });
        }

        function makePanelResizable(panel) {
            const handle = panel.querySelector(".resize-handle");
            
            handle.addEventListener("mousedown", (e) => {
                e.stopPropagation();
                e.preventDefault();
                
                isResizing = true;
                selectedPanel = panel;

                const containerRect = previewGrid.getBoundingClientRect();
                const startX = e.clientX;
                const startY = e.clientY;
                const startWidth = panel.offsetWidth;
                const startHeight = panel.offsetHeight;

                function onMouseMove(e) {
                    if (!isResizing) return;

                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;

                    let newWidth = startWidth + dx;
                    let newHeight = startHeight + dy;

                    // Minimum size
                    newWidth = Math.max(100, newWidth);
                    newHeight = Math.max(100, newHeight);

                    // Constrain to container
                    const maxWidth = containerRect.width - panel.offsetLeft;
                    const maxHeight = containerRect.height - panel.offsetTop;
                    newWidth = Math.min(newWidth, maxWidth);
                    newHeight = Math.min(newHeight, maxHeight);

                    panel.style.width = (newWidth / containerRect.width * 100) + "%";
                    panel.style.height = (newHeight / containerRect.height * 100) + "%";
                }

                function onMouseUp() {
                    isResizing = false;
                    document.removeEventListener("mousemove", onMouseMove);
                    document.removeEventListener("mouseup", onMouseUp);
                }

                document.addEventListener("mousemove", onMouseMove);
                document.addEventListener("mouseup", onMouseUp);
            });
        }

        // Initial load
        generatePanelLayout(parseInt(layoutSelect.value));

        // Update on change
        layoutSelect.addEventListener("change", (e) => {
            generatePanelLayout(parseInt(e.target.value));
        });

        // Function to save current panel layout
        function savePanelLayout() {
            const panels = previewGrid.querySelectorAll('[data-panel-number]');
            const layout = [];
            
            panels.forEach(panel => {
                layout.push({
                    x: parseFloat(panel.style.left),
                    y: parseFloat(panel.style.top),
                    width: parseFloat(panel.style.width),
                    height: parseFloat(panel.style.height)
                });
            });
            
            localStorage.setItem("mangaPanelLayout", JSON.stringify(layout));
        }

        // Save layout before generation
        const generateBtn = document.getElementById("generateBtn");
        if (generateBtn) {
            generateBtn.addEventListener("click", () => {
                savePanelLayout();
            });
        }
    </script>
    <script>
        const fullscreenBtn = document.getElementById("fullscreenBtn");
        const previewContainer = document.getElementById("previewContainer");

        fullscreenBtn.addEventListener("click", () => {
            if (!document.fullscreenElement) {
                previewContainer.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });
    </script>
    <script src="generator.js"></script>
</body>

</html>
